# Jason Stys: bounded synthetic hourly energy accounting and independent rational verification.
[project]
name = "resilient-energy-microgrid-lab"
version = "1.0.0"
description = "Offline research-station renewable/storage dispatch experiments by Jason Stys"
requires-python = ">=3.12,<3.15"
dependencies = []
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]
[tool.coverage.run]
branch = true
source = ["gridlab"]
[tool.coverage.report]
fail_under = 90
show_missing = true
[tool.mypy]
strict = true
python_version = "3.12"
files = ["gridlab"]
